name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Check the audio engine
        run: |
          g++ -std=c++17 -O2 -Iapp/src/main/cpp/engine enginetest/host.cpp -o smhost
          ./smhost test app/src/main/assets/demo.smx
          g++ -std=c++17 -O1 -fsanitize=address,undefined -fno-sanitize-recover=undefined -Iapp/src/main/cpp/engine enginetest/fuzz.cpp -o smfuzz
          timeout 600 ./smfuzz app/src/main/assets/demo.smx 1
      - name: Build
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk StringerMax.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StringerMax
          path: StringerMax.apk
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Stringer Max (latest build)
          body: "Build ${{ github.run_number }}. Download StringerMax.apk on the Thor and open it to install."
          files: StringerMax.apk
